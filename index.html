<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おかいもの">
<meta name="theme-color" content="#FFF9EC">
<title>おかいもの ごっこ｜MieeL</title>
<link rel="apple-touch-icon" id="touchIcon" href="">
<style>
  :root {
    --mieel: radial-gradient(circle at 50% 0%,#1B8FE8 0%,#2BB8D6 28%,#3FCB9E 45%,#8FD24A 58%,#F4D027 72%,#F7941E 100%);
    --bg: #FFF9EC; --ink: #1F2937; --sub: #6B7280; --line: #EEDFC2; --go: #2F9E44; --go-d: #237A34; --main: #E8590C; --main-d: #B8450A;
    --blue: #1C7ED6; --blue-d: #1864AB; --wood: #C8955A; --wood-d: #8D6237; --pink: #F06595;
    --emoji: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: "Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",system-ui,sans-serif; font-weight: 700;
    word-break: keep-all; overflow-wrap: anywhere; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; overscroll-behavior: none;
    display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  .emo { font-family: var(--emoji); font-weight: 400; line-height: 1; }
  .topbar { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 16px; min-height: 66px; }
  .brand { flex: 1; display: flex; justify-content: center; align-items: center; gap: 14px; color: #BFA67E; font-size: 16px; letter-spacing: .1em; }
  .mieel-brand { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .orb-mini { width: 22px; height: 22px; border-radius: 50%; background: var(--mieel); flex: none; }
  .mieel-brand strong { font-size: 16px; color: var(--ink); }
  .mieel-brand .url { font-size: 12px; color: var(--sub); font-weight: 600; }
  @media (max-width: 699px) { .topbar .mieel-brand .url { display: none; } }
  .gear { position: relative; width: 52px; height: 52px; border-radius: 50%; border: none; background: transparent; opacity: .35; font-size: 26px; display: grid; place-items: center; }
  .gear::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; border: 4px solid transparent; }
  .gear.pressing { opacity: 1; }
  .gear.pressing::after { border-color: var(--blue); animation: ring 1.5s linear forwards; }
  @keyframes ring { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  .homebtn { height: 52px; padding: 0 18px; border-radius: 999px; border: 3px solid var(--line); background: #fff; font-size: 18px; }
  .homebtn[hidden] { display: none; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 18px 16px; }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; animation: fadein .25s ease-out; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  @keyframes bump { 40% { transform: scale(1.12) rotate(-3deg); } }
  .title { font-size: clamp(28px, 4.2vw, 48px); text-align: center; margin: 4px 0 12px; }
  .pic { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .pic img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; pointer-events: none; }
  .pic .emoji { font-family: var(--emoji); font-weight: 400; line-height: 1; }
  .pic .letter { width: 1.5em; height: 1.5em; border-radius: 50%; display: grid; place-items: center; background: var(--main); color: #fff; }
  .big-btn { min-width: min(380px, 78vw); min-height: 92px; padding: 0 36px; border: none; border-radius: 999px; color: #fff; font-size: clamp(26px, 3.6vw, 40px); display: inline-flex; align-items: center; justify-content: center; gap: 12px; }
  .big-btn.go { background: var(--go); box-shadow: 0 8px 0 var(--go-d); }
  .big-btn.or { background: var(--main); box-shadow: 0 8px 0 var(--main-d); }
  .big-btn.blue { background: var(--blue); box-shadow: 0 8px 0 var(--blue-d); }
  .big-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .big-btn.dim { opacity: .4; }
  .actions { display: flex; gap: 16px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .round-btn { width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--line); background: #fff; font-size: 36px; box-shadow: 0 5px 0 var(--line); display: grid; place-items: center; }

  /* ---------- おみせを えらぶ ---------- */
  .shops { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; align-content: center; overflow-y: auto; padding: 6px; }
  .shop { position: relative; border: none; background: #fff; border-radius: 26px; overflow: hidden; box-shadow: 0 7px 0 rgba(0,0,0,.12); display: flex; flex-direction: column; align-items: center; padding: 0 0 14px; text-align: center; }
  .shop .awn { width: 100%; height: 46px; background: repeating-linear-gradient(90deg, var(--c) 0 34px, #fff 34px 68px); border-bottom: 6px solid var(--c); mask: radial-gradient(circle at 17px 46px, transparent 17px, #000 17.5px) 0 0 / 34px 100% repeat-x; -webkit-mask: radial-gradient(circle at 17px 46px, transparent 17px, #000 17.5px) 0 0 / 34px 100% repeat-x; }
  .shop .ic { font-size: clamp(72px, 9vw, 100px); margin-top: 8px; }
  .shop .nm { font-size: clamp(24px, 2.6vw, 30px); margin-top: 6px; line-height: 1.2; }
  .shop small { font-size: 15px; color: var(--sub); font-weight: 500; }
  .shop:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,.12); }

  /* ---------- メモ ---------- */
  .memo-scr { justify-content: center; align-items: center; gap: 14px; }
  .memo { background: #FFFDF5; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.12); padding: 20px 34px 24px; min-width: min(560px, 90vw); position: relative;
    background-image: repeating-linear-gradient(#FFFDF5 0 55px, #E3EEFA 55px 57px); transform: rotate(-1.2deg); }
  .memo::before { content: ""; position: absolute; top: -14px; left: 50%; width: 120px; height: 28px; transform: translateX(-50%) rotate(2deg); background: rgba(255, 212, 59, .7); }
  .memo h2 { margin: 0 0 8px; font-size: clamp(26px, 3.4vw, 38px); text-align: center; }
  .mrow { display: flex; align-items: center; gap: 14px; min-height: 57px; font-size: clamp(24px, 3vw, 34px); }
  .mrow .pic { width: 64px; height: 50px; }
  .mrow .pic .emoji { font-size: 46px; }
  .mrow .q { margin-left: auto; color: var(--main); }
  .mrow.ok { color: #ADB5BD; text-decoration: line-through; }
  .mrow { flex-wrap: wrap; }
  .mrow .cnt { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 4px; padding-left: 78px; margin: -4px 0 6px; font-size: 32px; }
  .memo-mini .mrow .cnt { padding-left: 48px; font-size: 24px; margin: -2px 0 4px; }
  .mrow .cnt .todo { opacity: .22; filter: grayscale(1); }
  .mrow .cnt .got { animation: pop .35s cubic-bezier(.2, 1.6, .4, 1); }
  .budget { font-size: clamp(26px, 3.4vw, 40px); text-align: center; }
  .budget b { color: var(--main); font-size: 1.4em; }

  /* ---------- おみせの なか ---------- */
  .store { display: grid; grid-template-columns: minmax(180px, 230px) minmax(0, 1fr) minmax(190px, 250px); gap: 14px; }
  .side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .memo-mini { background: #FFFDF5; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.1); padding: 10px 12px; font-size: clamp(16px, 1.8vw, 20px); }
  .memo-mini .t { text-align: center; color: var(--sub); font-size: 15px; }
  .memo-mini .mrow { min-height: 44px; font-size: inherit; gap: 8px; }
  .memo-mini .mrow .pic { width: 40px; height: 40px; }
  .memo-mini .mrow .pic .emoji { font-size: 32px; }
  .shelves { position: relative; border-radius: 22px; background: linear-gradient(#FFF3E0, #FFE8CC); border: 6px solid var(--wood-d); display: flex; flex-direction: column; justify-content: space-evenly; padding: 12px 10px; overflow-y: auto; min-height: 0; }
  .shelf { display: flex; justify-content: space-evenly; align-items: flex-end; gap: 6px; padding: 0 6px 10px; border-bottom: 14px solid var(--wood); box-shadow: 0 8px 0 -2px var(--wood-d); margin-bottom: 12px; flex-wrap: wrap; }
  .item { position: relative; border: none; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px; touch-action: none; min-width: 84px; }
  .item .pic { width: clamp(64px, 8vw, 96px); height: clamp(60px, 8.5vh, 92px); }
  .item .pic .emoji { font-size: clamp(52px, min(6.6vw, 8vh), 80px); }
  .item .tag { background: #fff; border: 2px solid #E03131; color: #C92A2A; border-radius: 8px; padding: 0 8px; font-size: clamp(15px, 1.7vw, 19px); }
  .item .nm { font-size: 14px; color: var(--sub); }
  .item.gone { opacity: .2; pointer-events: none; }
  .item.ng { animation: shake .45s; }
  .basket-box { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; }
  .basket-box .sum { margin-bottom: 44px; }
  #bagged .pic { width: 64px; height: 60px; }
  #bagged .pic .emoji { font-size: 52px; }
  #bagged { border-top: 4px dashed var(--line); padding-top: 10px; }
  #bagged::before { content: '🛍️ ふくろ'; width: 100%; text-align: center; color: var(--sub); font-size: 15px; }
  .basket { position: relative; width: 100%; min-height: 200px; border-radius: 18px 18px 34px 34px; border: 6px solid #F08C00; background: repeating-linear-gradient(90deg, #FFE8CC 0 16px, #FFD8A8 16px 20px); display: flex; flex-wrap: wrap; align-content: flex-end; justify-content: center; gap: 2px; padding: 34px 8px 10px; }
  .basket::before { content: ""; position: absolute; top: -40px; left: 18%; right: 18%; height: 56px; border: 7px solid #F08C00; border-bottom: none; border-radius: 60px 60px 0 0; }
  .basket.over { border-color: var(--go); box-shadow: 0 0 0 6px rgba(47,158,68,.3); }
  .basket.bump { animation: bump .45s cubic-bezier(.2, 1.6, .4, 1); }
  .basket .bi { border: none; background: transparent; padding: 0; }
  .basket .bi .pic { width: 62px; height: 60px; }
  .basket .bi .pic .emoji { font-size: 52px; }
  .basket.many .bi .pic { width: 44px; height: 42px; } .basket.many .bi .pic .emoji { font-size: 36px; }
  .basket.lots .bi .pic { width: 34px; height: 32px; } .basket.lots .bi .pic .emoji { font-size: 27px; }
  .basket .empty { position: absolute; inset: 40px 6px auto; text-align: center; color: #B3884A; font-size: 16px; }
  .sum { font-size: clamp(20px, 2.4vw, 26px); background: #fff; border-radius: 14px; padding: 6px 12px; border: 3px solid var(--line); text-align: center; }
  .sum.over { border-color: #E03131; color: #C92A2A; }
  .ghost { position: fixed; z-index: 70; pointer-events: none; transform: translate(-50%, -50%) scale(1.15); filter: drop-shadow(0 10px 12px rgba(0,0,0,.25)); }
  .ghost .pic { width: 100px; height: 100px; }
  .ghost .pic .emoji { font-size: 84px; }
  .flyer { position: fixed; z-index: 69; pointer-events: none; transition: transform .45s cubic-bezier(.4, 0, .6, 1), opacity .45s; }
  .hint { text-align: center; color: var(--sub); font-size: 17px; font-weight: 500; }

  /* ---------- レジ ---------- */
  .reg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto 1fr auto; gap: 12px; }
  .clerk { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 16px; }
  .clerk .face { font-size: clamp(60px, 8vh, 84px); }
  .bubble { position: relative; background: #fff; border: 4px solid var(--line); border-radius: 22px; padding: 10px 22px; font-size: clamp(22px, 2.8vw, 32px); }
  .bubble::before { content: ""; position: absolute; left: -16px; top: 50%; border: 10px solid transparent; border-right: 14px solid var(--line); transform: translateY(-50%); }
  .counter { background: linear-gradient(#ECECEC, #D9D9D9); border-radius: 22px; border: 6px solid #ADB5BD; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .counter .lab { text-align: center; color: #495057; font-size: 17px; }
  .lane { flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: 8px; overflow-y: auto; min-height: 0; }
  .scanitem { border: 4px solid #fff; background: #fff; border-radius: 18px; padding: 6px; display: flex; flex-direction: column; align-items: center; touch-action: none; box-shadow: 0 4px 0 #ADB5BD; }
  .scanitem .pic { width: 74px; height: 70px; }
  .scanitem .pic .emoji { font-size: 60px; }
  .scanitem .pr { font-size: 16px; color: #C92A2A; }
  .scanner { display: flex; align-items: center; gap: 12px; justify-content: center; }
  .scanner .glass { width: 150px; height: 90px; border-radius: 14px; background: #343A40; position: relative; overflow: hidden; border: 4px solid #868E96; }
  .scanner .glass::after { content: ""; position: absolute; left: 10%; right: 10%; top: 50%; height: 4px; background: #FA5252; box-shadow: 0 0 12px 4px rgba(250,82,82,.8); animation: scan 1.2s ease-in-out infinite alternate; }
  @keyframes scan { from { transform: translateY(-30px); } to { transform: translateY(30px); } }
  .scanner .glass.over { border-color: var(--go); }
  .display { background: #0B3D2E; color: #8CE99A; font-family: "Consolas", monospace; border-radius: 12px; padding: 10px 18px; font-size: clamp(28px, 4vw, 44px); min-width: 220px; text-align: right; border: 5px solid #495057; }
  .display small { display: block; font-size: 14px; color: #69DB7C; text-align: left; font-family: inherit; }
  .bagside { background: #fff; border-radius: 22px; border: 6px dashed var(--line); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }

  /* ---------- おさいふ ---------- */
  .pay { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto 1fr auto; gap: 12px; }
  .tray { position: relative; border-radius: 30px; background: radial-gradient(#5C4033, #3E2A20); border: 8px solid #2B1B14; min-height: 220px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 6px; padding: 16px; }
  .tray .lab { position: absolute; top: 8px; left: 0; right: 0; text-align: center; color: #E9D8C6; font-size: 16px; }
  .tray.over { box-shadow: 0 0 0 7px rgba(47,158,68,.45); }
  .tray .tm { border: none; background: none; padding: 0; }
  .wallet { border-radius: 26px; background: #FFF0F6; border: 6px solid var(--pink); padding: 14px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 12px; }
  .wm { border: none; background: none; padding: 2px; touch-action: none; position: relative; }
  .wm .n { position: absolute; right: -4px; bottom: -2px; background: var(--ink); color: #fff; border-radius: 999px; font-size: 13px; padding: 0 7px; }
  .wm.zero { opacity: .25; pointer-events: none; }
  .paybar { grid-column: 1 / -1; display: flex; justify-content: center; align-items: center; gap: 16px; flex-wrap: wrap; }
  .mn { display: inline-block; vertical-align: middle; }

  /* ---------- おつりの れんしゅう ---------- */
  .shop.study { background: linear-gradient(#FFF3BF, #fff 60%); }
  .shop.study .awn { background: repeating-linear-gradient(90deg, #F59F00 0 34px, #FFE066 34px 68px); border-bottom-color: #F59F00; }
  .chmenu { align-items: center; gap: 16px; overflow-y: auto; }
  .chmenu .lead { font-size: clamp(18px, 2.2vw, 24px); color: var(--sub); text-align: center; }
  .chlv { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; width: min(100%, 1100px); }
  .lvbtn { border: none; background: #fff; border-radius: 22px; box-shadow: 0 7px 0 rgba(0,0,0,.12); padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .lvbtn:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,.12); }
  .lvbtn .stars { color: #F59F00; font-size: 22px; letter-spacing: 2px; }
  .lvbtn .nm { font-size: clamp(21px, 2.3vw, 27px); }
  .lvbtn .ex { font-size: 34px; }
  .lvbtn small { color: var(--sub); font-size: 15px; font-weight: 500; }
  .chopts { display: flex; gap: 12px 28px; flex-wrap: wrap; justify-content: center; }
  .chopt { display: flex; align-items: center; gap: 8px; font-size: 17px; flex-wrap: wrap; justify-content: center; }
  .chopt button { border: 3px solid var(--line); background: #fff; border-radius: 999px; padding: 10px 16px; font-size: 17px; }
  .chopt button.on { border-color: var(--main); background: #FFF4E6; color: var(--main-d); }
  .chq-scr { gap: 10px; }
  .chtop { display: flex; align-items: center; gap: 12px; }
  .chtop .clerk { flex: 1; }
  .chtop .round-btn { width: 64px; height: 64px; font-size: 30px; }
  .chdots { display: flex; gap: 7px; }
  .chdots span { width: 18px; height: 18px; border-radius: 50%; background: #E9ECEF; }
  .chdots span.on { background: var(--go); }
  .chdots span.now { background: var(--main); transform: scale(1.3); }
  .role { background: #E7F5FF; color: var(--blue-d); border-radius: 999px; padding: 4px 14px; font-size: 16px; white-space: nowrap; }
  .chbody { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; }
  .chleft { background: #fff; border-radius: 24px; border: 5px solid var(--line); padding: 14px 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 0; overflow-y: auto; }
  .chitems { display: flex; gap: 22px; justify-content: center; align-items: flex-end; }
  .chit { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .chit .pic { width: clamp(80px, 10vw, 110px); height: clamp(70px, 11vh, 100px); }
  .chit .pic .emoji { font-size: clamp(60px, min(8vw, 10vh), 88px); }
  .chit .tag { background: #fff; border: 3px solid #E03131; color: #C92A2A; border-radius: 10px; padding: 0 10px; font-size: clamp(20px, 2.4vw, 26px); }
  .chit small { color: var(--sub); font-size: 15px; }
  .chline { font-size: clamp(22px, 2.6vw, 30px); display: flex; align-items: center; gap: 10px; }
  .chline b { color: var(--main); }
  .tape { width: 100%; }
  .tape .top { text-align: center; font-size: 16px; color: var(--sub); border: 3px solid #ADB5BD; border-bottom: none; height: 14px; border-radius: 8px 8px 0 0; margin: 18px 0 4px; position: relative; }
  .tape .top span { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); background: #fff; padding: 0 8px; }
  .tape .bar { display: flex; height: 48px; border-radius: 10px; overflow: hidden; border: 3px solid #495057; }
  .tape .p { background: #FFC9C9; }
  .tape .c { flex: 1; position: relative; background: repeating-linear-gradient(45deg, #FFF9DB 0 10px, #FFEC99 10px 20px); }
  .tape .c i { position: absolute; left: 0; top: 0; bottom: 0; background: #8CE99A; transition: width .3s; }
  .tape .c i.over { background: #FFA8A8; }
  .tape .lbl { display: flex; font-size: clamp(15px, 1.7vw, 19px); margin-top: 4px; }
  .tape .lbl span { text-align: center; white-space: nowrap; }
  .tape .lbl .cl { flex: 1; color: #E67700; }
  .cu { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; font-size: clamp(16px, 1.9vw, 20px); }
  .cu span { background: #E7F5FF; border-radius: 999px; padding: 4px 12px; }
  .cu span b { color: var(--blue-d); }
  .chright { display: flex; flex-direction: column; gap: 12px; min-height: 0; justify-content: center; }
  .chask { text-align: center; font-size: clamp(26px, 3.2vw, 38px); }
  .chcs { display: grid; gap: 14px; }
  .chc { border: none; border-radius: 22px; background: #fff; box-shadow: 0 7px 0 rgba(0,0,0,.14); min-height: 84px; font-size: clamp(30px, 4vw, 46px); color: var(--blue-d); }
  .chc:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,.14); }
  .chc.ng { opacity: .35; animation: shake .45s; pointer-events: none; }
  .chc.ok { background: var(--go); color: #fff; }
  .chc.small { min-height: 64px; font-size: 28px; padding: 0 24px; position: relative; z-index: 1; }
  .drawer { background: linear-gradient(#E9ECEF, #CED4DA); border: 6px solid #868E96; border-radius: 18px; padding: 26px 10px 10px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; position: relative; }
  .drawer .lab { position: absolute; top: 4px; left: 0; right: 0; text-align: center; color: #495057; font-size: 15px; }
  .chright .tray { min-height: 150px; flex: 1; }
  @media (orientation: portrait) { .chbody { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } }

    } while (prev && prev.paid - prev.ch === items.reduce((a, x) => a + x.price, 0) && g++ < 10);

      setTimeout(() => { if (screen !== 'chq') return; if (CH.i >= CH.n) renderChangeDone(); else { CH.q = makeChangeQ(CH.lv, q); renderChangeQ(); } }, 2600);
      return;
    }
    CH.miss++; sfx.ng();
    CH.hint = true; CH.cu = true; drawTape();
    let msg;
    if (st.chAns === 'coins') msg = v < q.ch ? 'あと ' + yen(q.ch - v) + ' たりないよ' : yen(v - q.ch) + ' おおいよ';
    else { msg = 'ちがうよ。ずを みて かんがえよう'; if (btn) btn.classList.add('ng'); }
    $('#bubble').textContent = msg;
    speak(msg.replace(/えん/g, '円') + '。' + cuSay());
    bump($('#hand'));
  }
  function renderChangeDone() {
    screen = 'done';
    const d = new Date();
    log.push({ d: d.toISOString().slice(0, 10), shop: 'おつりの れんしゅう ★' + CH.lv + (st.chAns === 'coins' ? '（おかね）' : '（えらぶ）'), n: CH.n, tot: '', paid: '', ch: '', miss: CH.miss, sec: Math.round((Date.now() - CH.t) / 1000) });
    persist();
    const next = CH_LEVELS.find(l => l.lv === CH.lv + 1);
    setView('done-scr', [
      h('h1', { class: 'goal-title rainbow-text' }, CH.miss ? 'おつり マスター！' : 'パーフェクト！'),
      h('div', { class: 'done-row' }, h('div', { class: 'bagbig emo' }, '🪙'),
        h('div', { class: 'receipt' }, h('h3', null, '🧑‍💼 レジの かかり'), h('hr'),
          h('div', { class: 'r' }, h('span', null, 'レベル'), h('span', null, CH_LEVELS[CH.lv - 1].stars)),
          h('div', { class: 'r tot' }, h('span', null, 'できた'), h('span', null, CH.n + 'もん')),
          h('div', { class: 'r' }, h('span', null, 'まちがい'), h('span', null, CH.miss + 'かい')),
          h('hr'), h('div', { style: 'text-align:center' }, 'おつかれさまでした'))),
      h('div', { class: 'actions' },
        h('button', { type: 'button', class: 'big-btn blue', onclick: () => { if (tapOk(600)) startChange(CH.lv); } }, '🔁 もういちど'),
        next ? h('button', { type: 'button', class: 'big-btn or', onclick: () => { if (tapOk(600)) startChange(next.lv); } }, '⬆ つぎの レベル') : null,
        h('button', { type: 'button', class: 'big-btn go', onclick: () => { if (tapOk(600)) renderChangeMenu(); } }, '🪙 レベルを えらぶ'))
    ]);
    setTimeout(() => { sfx.fanfare(); FX.big(); speak(CH.miss ? 'ぜんぶ できたね！ おつり マスター！' : 'パーフェクト！ まちがい なし！ すごい！'); }, 400);
  }

  /* ---- 6. レシートと おいわい ---- */
  function renderReceipt() {
    screen = 'done';
    const tot = scannedTotal(), d = new Date();
    const groups = {}; G.scanned.forEach(it => { const k = it.id; groups[k] = groups[k] || { it: it, n: 0 }; groups[k].n++; });
    log.push({ d: d.toISOString().slice(0, 10), shop: G.shop.name, n: G.scanned.length, tot: tot, paid: G.paid, ch: G.change, sec: Math.round((Date.now() - G.t) / 1000) });
    persist();
    setView('done-scr', [
      h('h1', { class: 'goal-title rainbow-text' }, 'おかいもの できた！'),
      h('div', { class: 'done-row' },
        h('div', { class: 'bagbig emo' }, '🛍️'),
        h('div', { class: 'receipt' },
          h('h3', null, G.shop.icon + ' ' + G.shop.name), h('div', { style: 'text-align:center;font-size:14px' }, d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate()), h('hr'),
          Object.keys(groups).map(k => h('div', { class: 'r' }, h('span', null, groups[k].it.name + (groups[k].n > 1 ? ' ×' + groups[k].n : '')), h('span', null, yen(groups[k].it.price * groups[k].n)))),
          h('hr'), h('div', { class: 'r tot' }, h('span', null, 'ごうけい'), h('span', null, yen(tot))),
          h('div', { class: 'r' }, h('span', null, 'おあずかり'), h('span', null, yen(G.paid))),
          h('div', { class: 'r' }, h('span', null, 'おつり'), h('span', null, yen(G.change))),
          h('hr'), h('div', { style: 'text-align:center' }, 'ありがとうございました'))),
      h('div', { class: 'actions' },
        h('button', { type: 'button', class: 'big-btn blue', onclick: () => { if (tapOk(600)) startShop(G.shop); } }, '🔁 もういちど'),
        h('button', { type: 'button', class: 'big-btn go', onclick: () => { if (tapOk(600)) renderHome(); } }, '🏠 ほかの おみせ'))
    ]);
    for (let i = 0; i < 6; i++) setTimeout(sfx.paper, i * 130);
    setTimeout(() => { sfx.fanfare(); FX.big(); speak('おかいもの できたね！ すごい！'); }, 900);
  }

  /* ============================================================
     先生用
     ============================================================ */
  let draft = { shop: 'super', n: '', e: '', p: 100, img: '' };
  const PRESETS = [
    { name: '★ はじめて', note: '1しゅるい・1こ・100えん たんい・ちょうど', set: { mode: 'memo', kinds: 1, qty: 'one', price: 'hundred', pay: 'exact', wallet: [100, 500], showSum: true, askChange: false } },
    { name: '★★', note: '2しゅるい・ときどき 2〜3こ・100えん たんい・ちょうど', set: { mode: 'memo', kinds: 2, qty: 'some', qmax: 3, price: 'hundred', pay: 'exact', wallet: [100, 500, 1000], showSum: true, askChange: false } },
    { name: '★★★', note: '2しゅるい・2〜3こ・10えん たんい・おつり', set: { mode: 'memo', kinds: 2, qty: 'some', qmax: 3, price: 'ten', pay: 'change', showSum: true, askChange: false } },
    { name: '★★★★', note: '3しゅるい・ぜんぶ 2〜5こ・98えん など・おつりを こたえる・ごうけい ひょうじ なし', set: { mode: 'memo', kinds: 3, qty: 'all', qmax: 5, price: 'real', pay: 'change', showSum: false, askChange: true } }
  ];
  function openSettings() { if (canSpeak) speechSynthesis.cancel(); renderSettings(); $('#settings').classList.add('open'); $('#settings').scrollTop = 0; }
  function closeSettings() { $('#settings').classList.remove('open'); document.body.classList.toggle('calm', !!st.calm); if (screen === 'home') renderHome(); }
  function refresh() { const m = $('#settings'), y = m.scrollTop; renderSettings(); m.scrollTop = y; }
  function set(k, v) { st[k] = v; persist(); refresh(); }
  function renderSettings() {
    const P = $('#settingsPanel'); P.innerHTML = '';
    const seg = (label, key, opts, note) => [h('div', { class: 'seglabel' }, label), h('div', { class: 'seg' }, opts.map(o => h('button', { type: 'button', class: String(st[key]) === String(o[0]) ? 'on' : '', onclick: () => set(key, o[0]) }, o[1]))), note ? h('p', { class: 'note' }, note) : null];
    const chk = (key, label) => h('label', { class: 'row' }, h('span', null, label), h('input', { type: 'checkbox', checked: !!st[key], onchange: e => { st[key] = e.target.checked; persist(); } }));
    const prev = h('div', { class: 'photo-prev' }, draft.img ? '' : 'しゃしん'); if (draft.img) prev.style.backgroundImage = 'url("' + draft.img + '")';
    const add = (...xs) => xs.flat(Infinity).forEach(x => { if (x !== null && x !== undefined && x !== false) P.append(x); });
    add(
      h('div', { class: 'panel-head' }, h('h2', null, '⚙️ 先生用せってい'), h('button', { type: 'button', class: 'btn ok', onclick: closeSettings }, 'とじる')),
      h('p', { class: 'note' }, '右上の ⚙️ を 1.5秒 ながおしで ひらきます（Shift＋S でも）。せっていは この端末に 保存されます。'),
      h('h3', null, 'むずかしさ（まとめて せってい）'),
      h('div', { class: 'seg' }, PRESETS.map(pr => h('button', { type: 'button', onclick: () => { Object.assign(st, pr.set); persist(); refresh(); toast(pr.name + ' に しました'); } }, pr.name))),
      h('p', { class: 'note' }, PRESETS.map(pr => pr.name + '：' + pr.note).join('　／　')),
      h('h3', null, 'かいものの しかた'),
      seg('もくひょう', 'mode', [['memo', '📝 おつかい メモ'], ['budget', '👛 おこづかいで じゆうに']]),
      st.mode === 'memo' ? [seg('メモの しゅるい', 'kinds', [[1, '1しゅるい'], [2, '2しゅるい'], [3, '3しゅるい'], [4, '4しゅるい']]), seg('おなじ ものを いくつ かう？', 'qty', [['one', '1こ ずつ'], ['some', 'ときどき 2こ いじょう'], ['all', 'ぜんぶ 2こ いじょう']], 'メモに「りんご ×3」のように でて、かごに いれるたびに「2こめ」と かぞえます。'),
        st.qty !== 'one' ? seg('いちばん おおくて', 'qmax', [[2, '2こ'], [3, '3こ'], [4, '4こ'], [5, '5こ']]) : null]
        : seg('おこづかい', 'budget', [[100, '100えん'], [300, '300えん'], [500, '500えん'], [1000, '1000えん']]),
      seg('ねだん', 'price', [['hundred', '100えん たんい（かんたん）'], ['ten', '10えん たんい'], ['real', '98えん など（ほんもの ふう）']]),
      h('h3', null, 'はらいかた'),
      seg('はらいかた', 'pay', [['exact', '🎯 ちょうど はらう'], ['change', '🪙 おおきい おかねで はらって おつりを もらう']], 'おつりモードでは、おさいふに「ごうけいより おおきい おかね」だけが はいります（100えん・500えん・1000えん・5000えん から じどうで）。'),
      st.pay === 'change' ? chk('askChange', '🤔 おつりを うけとる まえに「おつりは いくら？」を こたえる（3つから えらぶ）') : null,
      st.pay === 'exact' ? [h('div', { class: 'seglabel' }, 'おさいふに いれる おかね（ちょうど モード）'), h('div', { class: 'chips' }, MONEY.map(v => h('button', { type: 'button', class: 'chipt' + (st.wallet.indexOf(v) >= 0 ? ' on' : ''), onclick: () => { const w = st.wallet.slice(), i = w.indexOf(v); if (i >= 0) { if (w.length > 1) w.splice(i, 1); } else w.push(v); set('wallet', w); } }, yen(v))))] : null,
      chk('showSum', '🧮 かご・だした おかねの ごうけいを ひょうじ（たすけ）'),
      chk('showPrice', '🏷️ メモに ねだんを かく'),
      h('h3', null, 'しなものを つくる（写真も つけられます）'),
      h('p', { class: 'note' }, '学校の近くの お店の しなものや、実物の 写真で つくれます。'),
      h('div', { class: 'cform' },
        h('div', { class: 'crow' }, h('select', { onchange: e => { draft.shop = e.target.value; } }, SHOPS.map(s => h('option', { value: s.id, selected: s.id === draft.shop }, s.icon + ' ' + s.name))),
          h('input', { type: 'text', placeholder: 'なまえ', maxlength: '12', value: draft.n, oninput: e => { draft.n = e.target.value; } }),
          h('input', { type: 'text', placeholder: 'えもじ', maxlength: '6', style: 'width:90px', value: draft.e, oninput: e => { draft.e = e.target.value; } }),
          h('input', { type: 'number', min: '1', max: '9999', style: 'width:110px', value: draft.p, oninput: e => { draft.p = e.target.value; } }), 'えん'),
        h('div', { class: 'crow' }, prev, h('label', { class: 'btn' }, '📷 しゃしん', h('input', { type: 'file', accept: 'image/*', hidden: true, onchange: e => { const f = e.target.files && e.target.files[0]; if (f) toData(f).then(d => { draft.img = d; refresh(); }); } })),
          h('button', { type: 'button', class: 'btn ok', onclick: () => { if (!draft.n.trim()) { toast('なまえを いれてください'); return; } custom.push({ id: 'c' + uid(), shop: draft.shop, n: draft.n.trim(), e: draft.e.trim(), p: Number(draft.p) || 100, img: draft.img }); draft = { shop: draft.shop, n: '', e: '', p: 100, img: '' }; persist(); refresh(); toast('つくりました'); } }, '＋ つくる'))),
      h('div', { class: 'clist' }, custom.map(c => h('div', { class: 'citem' }, pic({ name: c.n, emoji: c.e, image: c.img }), h('span', { style: 'flex:1' }, (SHOPS.find(s => s.id === c.shop) || {}).name + '：' + c.n + '（' + yen(c.p) + '）'),
        h('button', { type: 'button', class: 'btn warn', onclick: () => { if (confirm('けしますか？')) { custom.splice(custom.indexOf(c), 1); persist(); refresh(); } } }, 'けす')))),
      h('h3', null, 'おと・ひょうじ'),
      chk('voice', '🗣️ こえで よみあげる'), chk('sound', '🔔 こうかおん（ピッ・チャリン など）'), chk('calm', '🌙 えんしゅつを ひかえめに'),
      h('h3', null, 'きろく'),
      h('p', { class: 'note' }, log.length ? 'これまで ' + log.length + 'かい。さいきん：' + log.slice(-5).reverse().map(l => l.d + ' ' + l.shop + (l.tot !== '' ? ' ' + yen(l.tot) : ' まちがい' + l.miss)).join('／') : 'まだ ありません'),
      h('div', { class: 'btns' }, h('button', { type: 'button', class: 'btn', onclick: exportCsv }, '⬇ CSV で かきだす')),
      h('div', { class: 'btns', style: 'margin-top:24px' }, h('button', { type: 'button', class: 'btn ok', onclick: closeSettings }, 'とじる')),
      h('div', { class: 'mieel-foot' }, h('div', { class: 'mieel-brand' }, h('span', { class: 'orb-mini' }), h('strong', null, 'MieeL'), h('a', { href: 'https://www.mieel-support-school.com/', target: '_blank', rel: 'noopener' }, 'www.mieel-support-school.com')), '© おかいもの ごっこ（特別支援教育向け）'));
  }
  function toData(file) {
    return new Promise((res, rej) => { const u = URL.createObjectURL(file), img = new Image(); img.onload = () => { const sc = Math.min(1, 360 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = img.width * sc; c.height = img.height * sc; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', .8)); }; img.onerror = rej; img.src = u; });
  }
  function exportCsv() {
    const rows = [['日にち', 'おみせ・れんしゅう', 'こすう・もんだい', 'ごうけい', 'はらった', 'おつり', 'まちがい', 'かかった秒']].concat(log.map(l => [l.d, l.shop, l.n, l.tot, l.paid, l.ch, l.miss === undefined ? '' : l.miss, l.sec]));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + rows.map(r => r.join(',')).join('\r\n')], { type: 'text/csv' })); a.download = 'okaimono.csv'; document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 500);
  }
  function bindGear() {
    const g = $('#gear'); let t = null; const c = () => { clearTimeout(t); g.classList.remove('pressing'); };
    g.addEventListener('pointerdown', e => { e.preventDefault(); g.classList.add('pressing'); t = setTimeout(() => { c(); openSettings(); }, 1500); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => g.addEventListener(ev, c));
    document.addEventListener('keydown', e => { if (e.shiftKey && (e.key === 'S' || e.key === 's')) openSettings(); if (e.key === 'Escape') closeSettings(); });
    $('#settings').addEventListener('click', e => { if (e.target.id === 'settings') closeSettings(); });
  }
  function makeTouchIcon() { try { const c = document.createElement('canvas'); c.width = c.height = 180; const g = c.getContext('2d'); g.fillStyle = '#FFA94D'; g.fillRect(0, 0, 180, 180); g.font = '118px "Apple Color Emoji","Segoe UI Emoji",sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('🛒', 90, 98); $('#touchIcon').href = c.toDataURL(); } catch (e) { /* 無視 */ } }

  document.body.classList.toggle('calm', !!st.calm);
  bindGear(); makeTouchIcon();
  if (canSpeak) { loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
  document.addEventListener('gesturestart', e => e.preventDefault());
  $('#homeBtn').addEventListener('click', () => { if (tapOk(500) && (screen === 'memo' || screen === 'done' || screen === 'chmenu' || confirm('おかいものを やめて おみせを えらびなおしますか？'))) renderHome(); });
  renderHome();
})();
</script>
